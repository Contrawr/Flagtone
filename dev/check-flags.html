<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag check</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; background: #f5f1ed; }
    #summary { font-weight: 700; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { background: #fff; border-radius: 10px; padding: 8px; border: 2px solid #ddd6cf; }
    .card.bad { border-color: #c9473f; }
    .card svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
    .chips { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .chips i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div id="summary">Checking…</div>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { FLAGS } from '../js/flags.js';
    import { analyzeFlag } from '../js/flagLoader.js';

    const grid = document.getElementById('grid');
    const bad = [];
    let fallback = 0;
    for (const f of FLAGS) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.code = f.code;
      let failed = false;
      try {
        const { svg, candidates, usedFallback } = await analyzeFlag(f.code);
        if (usedFallback) fallback++;
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        card.append(svg);
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const hex of candidates) {
          const i = document.createElement('i');
          i.style.background = hex;
          i.title = hex;
          chips.append(i);
        }
        card.append(chips);
        if (candidates.length === 0) { failed = true; bad.push(`${f.code}: no candidates`); }
      } catch (err) {
        failed = true;
        bad.push(`${f.code}: ${err.message}`);
      }
      if (failed) card.classList.add('bad');
      card.append(`${f.code} · ${f.name} · ${f.tier}`);
      grid.append(card);
    }
    document.getElementById('summary').textContent =
      `${FLAGS.length} flags checked, ${bad.length} problems, ${fallback} used the canvas fallback${bad.length ? ': ' + bad.join(', ') : ''}`;
    window.checkResult = { total: FLAGS.length, bad, fallback };
  </script>
</body>
</html>
